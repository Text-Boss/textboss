[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  framework = "#static"
  port = 8888
  publish = "."
  functions = "netlify/functions"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.onesignal.com; font-src 'self'; connect-src 'self' https://onesignal.com https://api.onesignal.com; frame-ancestors 'none';"

# Run send-reminders every hour to check for appointments within the next 24h
[functions."send-reminders"]
  schedule = "0 * * * *"

# Run send-follow-ups daily at 9am UTC to notify owners of due follow-up messages
[functions."send-follow-ups"]
  schedule = "0 9 * * *"

# Run send-todo-reminders every 15 minutes to deliver due to-do alerts
[functions."send-todo-reminders"]
  schedule = "*/15 * * * *"
